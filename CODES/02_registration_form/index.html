<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration</title><link rel="stylesheet" href="style.css"></head><body><form id="registration"><h1>Student Registration</h1><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><label>Date of birth<input name="dob" type="date"></label><label>Course<select name="course"><option>BCA</option><option>BBA</option><option>B.Sc.</option></select></label><label>Gender<select name="gender"><option>Prefer not to say</option><option>Male</option><option>Female</option><option>Other</option></select></label><button>Register</button><p id="message"></p></form><script src="script.js"></script></body></html>
